<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2f6b3a">
  <title>Totopapaveromania</title>
  <link rel="stylesheet" href="stile.css">
</head>
<body>
  <header>
    <h1 id="titolo">Totopapaveromania</h1>
    <span class="sq" id="nomeSq"></span>
  </header>

  <main>
    <!-- Ingresso -->
    <section id="schermoIngresso" class="card">
      <span class="etichetta">Benvenuti</span>
      <p>Scrivete il nome della vostra squadriglia per iniziare, e tenete questa pagina aperta per tutto il gioco.</p>
      <form id="formIngresso">
        <input id="campoNome" placeholder="Nome della squadriglia" autocomplete="off" maxlength="40" required>
        <div class="errore" id="erroreIngresso"></div>
        <button type="submit">Entra</button>
      </form>
    </section>

    <!-- Gioco -->
    <section id="schermoGioco" class="nascosto">
      <div class="card">
        <div class="progresso" id="progresso"></div>
        <span class="etichetta" id="etichettaFase"></span>
        <div class="testo" id="testoFase"></div>
      </div>

      <div class="card" id="bloccoMissione">
        <p><strong>Missione completata?</strong> Caricate una foto come prova.</p>
        <div class="scelta-foto">
          <label class="bottone-foto" for="campoFotoScatta">📷 Scatta la foto</label>
          <label class="bottone-foto" for="campoFotoGalleria">🖼️ Dalla galleria</label>
        </div>
        <!-- capture apre direttamente la fotocamera: su Android senza capture si vede solo la galleria -->
        <input id="campoFotoScatta" type="file" accept="image/*" capture="environment" class="file-nascosto">
        <input id="campoFotoGalleria" type="file" accept="image/*" class="file-nascosto">
        <img id="anteprima" class="anteprima nascosto" alt="Anteprima della foto">
        <div class="errore" id="erroreFoto"></div>
        <button id="btnInviaFoto" class="nascosto">Invia la foto e vai avanti ✔</button>
        <button id="btnSenzaFoto" class="link">Non riusciamo a caricare la foto</button>
      </div>

      <form class="card" id="bloccoDomanda">
        <label for="campoRisposta"><strong>La vostra risposta</strong></label>
        <textarea id="campoRisposta" required></textarea>
        <div class="errore" id="erroreRisposta"></div>
        <button type="submit">Invia risposta</button>
      </form>

      <div class="card" id="bloccoArrivo">
        <a class="bottone" id="linkMappa" target="_blank" rel="noopener">Apri il punto nelle Mappe</a>
      </div>

    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
